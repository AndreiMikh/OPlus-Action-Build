name: 🍃 OnePlusOSS Kernel Monitor

# Monitors OnePlusOSS kernel repositories and kernel manifests every 12 hours.
# State is persisted on the status-page branch. Failed/incomplete scans never
# replace valid state from a previous successful scan.

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

concurrency:
  group: oneplusoss-kernel-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      actions: write

    env:
      ORG: OnePlusOSS
      STATEFILE: old-state.json
      GH_TOKEN: ${{ github.token }}
      GH_HTTP_TIMEOUT: 600
      MAXRETRIES: 4
      DELAYRETRIES: 5
      SUMMARYLIMIT: 5000
      REPOSITORYOWNER: ${{ github.repository_owner }}

    steps:
      - name: 📥 Checkout Main Branch
        uses: actions/checkout@v6
        with:
          path: main
          fetch-depth: 1

      - name: 🚫 Configure Repository Exclusions
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >> "$GITHUB_ENV" <<'EOF'
          BLREPOS<<BLACKLIST

          BLACKLIST
          EOF

      - name: 💾 Restore Persistent Monitor State
        shell: bash
        run: |
          set -Eeuo pipefail

          STATUSURL="https://github.com/${{ github.repository }}.git"
          STATUSAPI="repos/${{ github.repository }}/branches/status-page"
          rm -rf repostatus
          mkdir -p repostatus

          api_ok() { gh api "$STATUSAPI" --silent >/dev/null 2>&1; }
          auth_failed() {
            grep -qiE 'Bad credentials|401|403|forbidden|Resource not accessible'
          }

          echo "🔎 Checking status-page branch..."
          if api_ok; then
            git -C repostatus init -q
            git -C repostatus remote add origin "$STATUSURL"
            gh auth setup-git
            git -C repostatus fetch --quiet origin refs/heads/status-page
            git -C repostatus checkout --quiet -B status-page FETCH_HEAD
            if [[ -f repostatus/$STATEFILE ]]; then
              cp "repostatus/$STATEFILE" "main/$STATEFILE"
              echo "✔️ Existing State Restored"
            else
              echo "ℹ️ State File Missing; Starting Empty"
              echo '{}' > "main/$STATEFILE"
            fi
          else
            ERROR="$(gh api "$STATUSAPI" --silent 2>&1 || true)"
            if printf '%s\n' "$ERROR" | auth_failed; then
              echo "❌ GitHub Token Cannot Access status-page"
              printf '%s\n' "$ERROR"
              exit 1
            fi
            echo "ℹ️ status-page Does Not Exist; Starting Empty"
            echo '{}' > "main/$STATEFILE"
          fi

          if ! jq -e 'type == "object"' "main/$STATEFILE" >/dev/null 2>&1; then
            echo "⚠️ Invalid State File; Backing It Up and Resetting"
            cp "main/$STATEFILE" "main/${STATEFILE}.invalid.$(date +%s)" 2>/dev/null || true
            echo '{}' > "main/$STATEFILE"
          fi

      - name: 🔍 Scan OnePlusOSS Repositories
        id: scanner
        shell: bash
        run: |
          set -Eeuo pipefail
          cd main

          : > ../manifest_summary.md
          : > ../local-summary.md
          : > notification.md
          : > ../summary-rows.md
          printf '%s\n' '### 📓 Kernel Manifests Report' > ../manifest_summary.md
          printf '%s\n' '### 🛠 Kernel Trees Report' > ../local-summary.md

          [[ -s "$STATEFILE" ]] || echo '{}' > "$STATEFILE"
          echo '{}' > new-state.json

          TOTALREPOS=0; SCANNEDREPOS=0; FAILEDREPOS=0; TOTALBRANCHES=0
          NEWBRANCHCOUNT=0; UPDATEDBRANCHCOUNT=0; DELETEDCOUNT=0; SUMMARYROWS=0
          NEWREPOS=""; NEWBRANCH=""; UPDATEDBRANCH=""; DELETEDITEM=""
          DETECTEDCHANGE=false
          declare -A PLATFORM_ROWS=() FLATCOUNT=() BRANCHMAP=()

          is_blacklisted() {
            grep -Fqx -- "$1" <<< "$BLREPOS"
          }

          platform() {
            local repo="$1" p
            case "$repo" in
              kernel_manifest) echo OnePlusOSS; return ;;
            esac
            p="$(grep -oEi '(sm|mt)[0-9]{4,5}' <<< "$repo" | head -n1 | tr '[:lower:]' '[:upper:]' || true)"
            [[ -n "$p" ]] && echo "OnePlus-$p" || echo OTHER
          }

          family() {
            local repo="$1"
            if [[ "$repo" == kernel_manifest ]]; then echo MANIFEST
            elif [[ "$repo" =~ sm[0-9]{4,5} ]]; then echo SM
            elif [[ "$repo" =~ mt[0-9]{4,5} ]]; then echo MT
            else echo OTHER
            fi
          }

          display_repo() {
            local repo="$1" c
            case "$repo" in
              kernel_manifest) echo OnePlusOSS ;;
              *sm[0-9]*)
                c="$(grep -oEi 'sm[0-9]{4,5}' <<< "$repo" | head -n1 | tr '[:lower:]' '[:upper:]' || true)"
                echo "${c:-$repo}" ;;
              *mt[0-9]*)
                c="$(grep -oEi 'mt[0-9]{4,5}' <<< "$repo" | head -n1 | tr '[:lower:]' '[:upper:]' || true)"
                echo "${c:-$repo}" ;;
              *) echo "$repo" ;;
            esac
          }

          # Explicit legacy/current mappings from the original workflow.
                    BRANCHMAP['oneplus/sm6375_b_16.0.0_nord_ce4_lite_5g']='Nord CE4 Lite 5G-B-16.0.0'
          BRANCHMAP['oneplus/sm6375_v_15.0.0_nord_ce4_lite_5g']='Nord CE4 Lite 5G-V-15.0.0'
          BRANCHMAP['oneplus/sm6375_u_14.0.1_nord_ce4_lite_5g']='Nord CE4 Lite 5G-U-14.0.1'
          BRANCHMAP['oneplus/sm6375_v_15.0.0_nord_ce3_lite_5g']='Nord CE3 Lite 5G-V-15.0.0'
          BRANCHMAP['oneplus/sm7550_b_16.0.0_nord_ce4']='Nord CE4-B-16.0.0'
          BRANCHMAP['oneplus/sm7550_v_15.0.0_nord_ce4']='Nord CE4-V-15.0.0'
          BRANCHMAP['oneplus/sm7550_u_14.0.1_oneplus_nord_ce4']='Nord CE4-U-14.0.1'
          BRANCHMAP['oneplus/sm7635_b_16.0.0_nord_ce6']='Nord CE6-B-16.0.0'
          BRANCHMAP['oneplus/sm7635_b_16.0.0_turbo_6v']='Turbo 6V-B-16.0.0'
          BRANCHMAP['oneplus/sm7675_b_16.0.0_ace_3v']='Ace 3V-B-16.0.0'
          BRANCHMAP['oneplus/sm7675_b_16.0.0_nord_4']='Nord 4-B-16.0.0'
          BRANCHMAP['oneplus/sm7675_v_15.0.0_ace_3v']='Ace 3V-V-15.0.0'
          BRANCHMAP['oneplus/sm7675_v_15.0.0_nord_4']='Nord 4-V-15.0.0'
          BRANCHMAP['oneplus/sm7675_u_14.0.1_oneplus_ace3v']='Ace 3V-U-14.0.1'
          BRANCHMAP['oneplus/sm7675_u_14.1.0_oneplus_nord4']='Nord 4-U-14.1.0'
          BRANCHMAP['oneplus/sm8550_t_13.1.0_oneplus11']='OnePlus 11-T-13.1.0'
          BRANCHMAP['oneplus/sm8550_t_13.1_ace2pro']='Ace 2 Pro-T-13.1'
          BRANCHMAP['oneplus/sm8550_t_13.2_open']='Open-T-13.2'
          BRANCHMAP['oneplus_sm8550_t_13.0_oneplus_11']='OnePlus 11-T-13.0'
          BRANCHMAP['oneplus/sm8475_s_12.1_oneplus_10t_5g']='OnePlus 10T 5G-S-12.1'
          BRANCHMAP['oneplus/sm8475_t_13.0.0_ace_pro']='Ace Pro-T-13.0.0'
          BRANCHMAP['oneplus/sm8475_t_13.1.0_11r_5g']='OnePlus 11R 5G-T-13.1.0'
          BRANCHMAP['oneplus_sm8475_t_13.0_oneplus_11R_5G']='OnePlus 11R 5G-T-13.0'
          BRANCHMAP['oneplus/sm8450_s_12.1_10_pro']='OnePlus 10 Pro-S-12.1'
          BRANCHMAP['oneplus/sm8450_t_13.0_10pro']='OnePlus 10 Pro-T-13.0'
          BRANCHMAP['oneplus/sm8450_t_13.1.0_10pro']='OnePlus 10 Pro-T-13.1.0'
          BRANCHMAP[' oneplus/sm8650_b_16.0.0_ace_3_pro']='Ace 3 Pro-B-16.0.0'
          BRANCHMAP['oneplus/sm8750_b_16.0.0_oneplus_13']='OnePlus 13-B-16.0.0'
          BRANCHMAP['oneplus/sm8750_b_16.0.0_oneplus_13s']='OnePlus 13S-B-16.0.0'
          BRANCHMAP['oneplus/sm8750_b_16.0.0_oneplus_13t']='OnePlus 13T-B-16.0.0'
          BRANCHMAP['oneplus/sm8750_b_16.0.0_ace_5_pro']='Ace 5 Pro-B-16.0.0'
          BRANCHMAP['oneplus/sm8750_b_16.0.0_ace_6']='Ace 6-B-16.0.0'
          BRANCHMAP['oneplus/sm8750_b_16.0.0_pad_2_pro']='Pad 2 Pro-B-16.0.0'
          BRANCHMAP['oneplus/sm8750_b_16.0.0_pad_3']='Pad 3-B-16.0.0'
          BRANCHMAP['oneplus/sm8750_b_16.0.0_oneplus_12']='OnePlus 12-B-16.0.0'
          BRANCHMAP['10r-U-14.0.0']='OnePlus 10R-U-14.0.0'
          BRANCHMAP['Ace Race-U-14.0.0']='Ace Race-U-14.0.0'
          BRANCHMAP['Ace Race-V-15.0.0']='Ace Race-V-15.0.0'
          BRANCHMAP['Ace-U-14.0.0']='Ace-U-14.0.0'
          BRANCHMAP['Ace-V-15.0.0']='Ace-V-15.0.0'
          BRANCHMAP['Oneplus 10r-V-15.0.0']='OnePlus 10R-V-15.0.0'
          BRANCHMAP['mt6895_t_13.1.0_oneplus_ace']='Ace-T-13.1.0'
          BRANCHMAP['oneplus/mt6895_s_12.1_oneplus_10r']='OnePlus 10R-S-12.1'
          BRANCHMAP['oneplus/mt6895_s_12.1_oneplus_ace_race']='Ace Race-S-12.1'
          BRANCHMAP['oneplus/mt6895_t_13.0.0']='MT6895-T-13.0.0'
          BRANCHMAP['oneplus/mt6895_t_13.0.0_ace_racing']='Ace Racing-T-13.0.0'
          BRANCHMAP['oneplus/mt6983_t_13.0_oneplus_ace_2v']='Ace 2V-T-13.0'
          BRANCHMAP['oneplus/mt6983_t_13.1.0_onepluspad']='OnePlus Pad-T-13.1.0'
          BRANCHMAP['oneplus/mt6983_t_13.1_oneplus_nord_3_5g']='Nord 3 5G-T-13.1'
          BRANCHMAP['oneplus_mt6983_u_14.0.0_nord_3_5g']='Nord 3 5G-U-14.0.0'
          BRANCHMAP['oneplus_mt6983_u_14.0.0_oneplus_ace_2v']='Ace 2V-U-14.0.0'
          BRANCHMAP['Ace 2v-U-14.0.0']='OnePlus Ace 2V-U-14.0.0'

          branch_name() {
            local b="$1" short variant version device mapped
            [[ -n "${BRANCHMAP[$b]+x}" ]] && { echo "${BRANCHMAP[$b]}"; return; }

            case "$b" in
              oneplus/sm6375|oneplus/sm7550|oneplus/sm7635|oneplus/sm7675|              oneplus/sm8450|oneplus/sm8475|oneplus/sm8550|oneplus/sm8635|              oneplus/sm8650|oneplus/sm8735|oneplus/sm8750|oneplus/sm8845|oneplus/sm8850)
                echo "OnePlus-${b##*sm}"; return ;;
              oneplus/(sm|mt)*)
                ;;
            esac

            short="${b#oneplus/}"
            if [[ "$short" =~ ^(sm|mt)([0-9]{4,5})_((b|u|v|s|t)_([0-9]+\.[0-9]+(\.[0-9]+)?)_?(.*))$ ]]; then
              variant="${BASH_REMATCH[4]}"
              version="${BASH_REMATCH[5]}"
              device="${BASH_REMATCH[7]}"
            else
              echo "$b"; return
            fi

            device="${device,,}"
            case "$device" in
              nord_ce4_lite_5g) mapped="Nord CE4 Lite 5G" ;;
              nord_ce3_lite_5g) mapped="Nord CE3 Lite 5G" ;;
              nord_ce4) mapped="Nord CE4" ;;
              nord_ce6) mapped="Nord CE6" ;;
              nord_3_5g) mapped="Nord 3 5G" ;;
              nord_4|nord4) mapped="Nord 4" ;;
              turbo_6v) mapped="Turbo 6V" ;;
              ace_2v|ace2v) mapped="Ace 2V" ;;
              ace_3v|ace3v) mapped="Ace 3V" ;;
              ace_3_pro) mapped="Ace 3 Pro" ;;
              ace_5_pro) mapped="Ace 5 Pro" ;;
              ace_6) mapped="Ace 6" ;;
              ace_race) mapped="Ace Race" ;;
              ace_racing) mapped="Ace Racing" ;;
              oneplus_13) mapped="OnePlus 13" ;;
              oneplus_13s) mapped="OnePlus 13S" ;;
              oneplus_13t) mapped="OnePlus 13T" ;;
              oneplus_12) mapped="OnePlus 12" ;;
              oneplus_11|oneplus11) mapped="OnePlus 11" ;;
              oneplus_11r_5g|11r_5g) mapped="OnePlus 11R 5G" ;;
              oneplus_10_pro|10_pro|10pro) mapped="OnePlus 10 Pro" ;;
              oneplus_10t_5g|10t_5g) mapped="OnePlus 10T 5G" ;;
              oneplus_10t|10t) mapped="OnePlus 10T" ;;
              ace_2_pro|ace2pro) mapped="Ace 2 Pro" ;;
              ace_pro) mapped="Ace Pro" ;;
              oneplus_10r|10r) mapped="OnePlus 10R" ;;
              oneplus_ace) mapped="OnePlus Ace" ;;
              onepluspad|oneplus_pad) mapped="OnePlus Pad" ;;
              pad_2_pro) mapped="Pad 2 Pro" ;;
              pad_3) mapped="Pad 3" ;;
              *) mapped="$(sed -E 's/^oneplus_//; s/_/ /g' <<< "$device" | awk '{for(i=1;i<=NF;i++)$i=toupper(substr($i,1,1)) substr($i,2); print}')" ;;
            esac
            printf '%s-%s-%s\n' "$mapped" "${variant^^}" "$version"
          }

          KERNELQUERY='query($name:String!,$owner:String!,$cursor:String) {
            repository(name:$name,owner:$owner) {
              refs(refPrefix:"refs/heads/",first:100,after:$cursor,
                   orderBy:{field:ALPHABETICAL,direction:ASC}) {
                nodes { name target { ... on Commit { oid message
                  file(path:"Makefile") { ... on TreeEntry { object { ... on Blob { text } } } }
                } }
                pageInfo { endCursor hasNextPage }
              }
            }
          }'

          MANIFESTQUERY='query($name:String!,$owner:String!,$cursor:String) {
            repository(name:$name,owner:$owner) {
              refs(refPrefix:"refs/heads/",first:100,after:$cursor,
                   orderBy:{field:ALPHABETICAL,direction:ASC}) {
                nodes { name target { ... on Commit { oid message tree { entries { name oid } } } }
                pageInfo { endCursor hasNextPage }
              }
            }
          }'

          graphql_page() {
            local query="$1" repo="$2" cursor="${3:-}" response="" attempt
            for attempt in $(seq 1 "$MAXRETRIES"); do
              echo "🌐 GraphQL page (attempt $attempt/$MAXRETRIES)"
              if [[ -n "$cursor" ]]; then
                response="$(gh api graphql -f query="$query" -f owner="$ORG" -f name="$repo" -f cursor="$cursor" 2>&1 || true)"
              else
                response="$(gh api graphql -f query="$query" -f owner="$ORG" -f name="$repo" 2>&1 || true)"
              fi
              if jq -e '((.errors // [])|length==0) and (.data.repository != null)' <<< "$response" >/dev/null 2>&1; then
                printf '%s' "$response"; return 0
              fi
              echo "⚠️ GraphQL request failed"
              jq -r '.errors[]?.message // empty' <<< "$response" 2>/dev/null || true
              [[ "$attempt" -lt "$MAXRETRIES" ]] && sleep "$((DELAYRETRIES * attempt))"
            done
            return 1
          }

          discover_repos() {
            gh repo list "$ORG" --limit 1000 --json name --jq '
              .[] | select(
                (.name == "kernel_manifest" or (.name|startswith("android_kernel_")))
                and ((.name|contains("modules"))|not)
                and ((.name|contains("techpack"))|not)
              ) | .name'
          }

          append_state() {
            jq --arg r "$1" --arg b "$2" --arg v "$3" '.[$r][$b]=$v' new-state.json > tmp.json
            mv tmp.json new-state.json
          }

          old_value() {
            jq -r --arg r "$1" --arg b "$2" '.[$r][$b] // "NONE"' "$STATEFILE"
          }

          render_manifest() {
            local row="$1" old="$2" sha="$3" status="$4"
            local files oldfiles fname foid oldoid fs
            printf '#### Branch: `%s` %s\n\n' "$(jq -r '.name' <<< "$row")" "$status" >> "$TARGET"
            printf '* **Latest Commit:** `%s`\n\n| File Name | Status |\n| :--- | :--- |\n' "${sha:0:7}" >> "$TARGET"
            files="$(jq -c '(.target.tree.entries // [])' <<< "$row")"
            oldfiles='{}'
            [[ "$old" != NONE ]] && oldfiles="$(cut -d'|' -f2- <<< "$old" | jq -c . 2>/dev/null || echo '{}')"
            while IFS=$'\t' read -r fname foid; do
              [[ -z "$fname" ]] && continue
              oldoid="$(jq -r --arg f "$fname" '.[$f] // "NONE"' <<< "$oldfiles")"
              if [[ "$oldoid" == NONE ]]; then fs="🆕 New"
              elif [[ "$oldoid" != "$foid" ]]; then fs="📝 Modified"
              else fs="✅"; fi
              printf '| `%s` | %s |\n' "$fname" "$fs" >> "$TARGET"
            done < <(jq -r '.[] | "\(.name)\t\(.oid)"' <<< "$files")
            printf '\n---\n\n' >> "$TARGET"
          }

          render_kernel() {
            local row="$1" kernel="$2" sha="$3" status="$4" msg="$5"
            printf '#### Branch: `%s` %s\n' "$(jq -r '.name' <<< "$row")" "$status" >> "$TARGET"
            printf '* **Kernel Version:** `%s`\n* **Commit SHA:** `%s`\n* **Message:** %s\n\n---\n\n'               "$kernel" "${sha:0:7}" "$msg" >> "$TARGET"
          }

          REPOS="$(discover_repos)"
          [[ -n "$REPOS" ]] || { echo "❌ Unable to retrieve OnePlusOSS repositories"; exit 1; }
          TOTALREPOS="$(grep -c . <<< "$REPOS" || true)"
          echo "📊 Found $TOTALREPOS repositories"

          while IFS= read -r repo; do
            [[ -z "$repo" ]] && continue
            is_blacklisted "$repo" && { echo "🚫 Skipping: $repo"; continue; }

            [[ "$repo" == kernel_manifest ]] && { QUERY="$MANIFESTQUERY"; TARGET="../manifest_summary.md"; } || { QUERY="$KERNELQUERY"; TARGET="../local-summary.md"; }
            old_repo=false
            jq -e --arg r "$repo" '.[$r] != null' "$STATEFILE" >/dev/null 2>&1 && old_repo=true

            BRANCHDATA=""; CURSOR=""; complete=false
            while true; do
              if ! RESPONSE="$(graphql_page "$QUERY" "$repo" "$CURSOR")"; then break; fi
              nodes="$(jq -c '.data.repository.refs.nodes[]?' <<< "$RESPONSE")"
              [[ -n "$nodes" ]] && BRANCHDATA+="${BRANCHDATA:+$'\n'}$nodes"
              next="$(jq -r '.data.repository.refs.pageInfo.endCursor // empty' <<< "$RESPONSE")"
              has="$(jq -r '.data.repository.refs.pageInfo.hasNextPage' <<< "$RESPONSE")"
              [[ "$has" != true ]] && { complete=true; break; }
              [[ -n "$next" ]] || { echo "⚠️ Pagination returned no cursor"; break; }
              CURSOR="$next"
            done

            if ! $complete; then
              FAILEDREPOS=$((FAILEDREPOS + 1))
              echo "⚠️ Incomplete scan: $repo"
              if $old_repo; then
                jq --arg r "$repo" --argjson v "$(jq -c --arg r "$repo" '.[$r] // {}' "$STATEFILE")" '.[$r]=$v' new-state.json > tmp.json
                mv tmp.json new-state.json
              fi
              continue
            fi

            SCANNEDREPOS=$((SCANNEDREPOS + 1))
            $old_repo || { NEWREPOS+="- 🆕 **$repo**"$'\n'; DETECTEDCHANGE=true; }
            printf '<details><summary><b>%s</b></summary>\n\n' "$repo" >> "$TARGET"

            while IFS= read -r row; do
              [[ -z "$row" ]] && continue
              branch="$(jq -r '.name // empty' <<< "$row")"
              sha="$(jq -r '.target.oid // empty' <<< "$row")"
              [[ -z "$branch" || -z "$sha" ]] && continue
              TOTALBRANCHES=$((TOTALBRANCHES + 1))
              old="$(old_value "$repo" "$branch")"
              status="✅"; kernel="N/A"

              if [[ "$repo" == kernel_manifest ]]; then
                files="$(jq -c '(.target.tree.entries // []) | reduce .[] as $i ({}; .[$i.name]=$i.oid)' <<< "$row")"
                current="$sha|$files"
                [[ "$old" == NONE ]] && status="🆕"
                [[ "$old" != NONE && "$old" != "$current" ]] && status="🔄 Updated"
                render_manifest "$row" "$old" "$sha" "$status"
                kernel=MANIFEST
              else
                makefile="$(jq -r '.target.file.object.text // empty' <<< "$row")"
                v="$(grep -oE '^VERSION[[:space:]]*=[[:space:]]*[0-9]+' <<< "$makefile" | grep -oE '[0-9]+' | head -n1 || true)"
                p="$(grep -oE '^PATCHLEVEL[[:space:]]*=[[:space:]]*[0-9]+' <<< "$makefile" | grep -oE '[0-9]+' | head -n1 || true)"
                s="$(grep -oE '^SUBLEVEL[[:space:]]*=[[:space:]]*[0-9]+' <<< "$makefile" | grep -oE '[0-9]+' | head -n1 || true)"
                [[ -n "$v" && -n "$p" ]] && kernel="$v.$p${s:+.$s}"
                current="$sha|$kernel"
                [[ "$old" == NONE ]] && status="🆕"
                [[ "$old" != NONE && "$old" != "$current" ]] && status="🔄 Updated"
                msg="$(jq -r '.target.message // empty' <<< "$row" | head -n1 | tr '\r\n' ' ' | cut -c1-200 | sed 's/[|`]/ /g')"
                render_kernel "$row" "$kernel" "$sha" "$status" "$msg"
              fi

              if [[ "$status" != "✅" ]]; then
                DETECTEDCHANGE=true
                if [[ "$status" == "🆕" ]]; then
                  NEWBRANCHCOUNT=$((NEWBRANCHCOUNT + 1))
                  NEWBRANCH+="- ✨ **$repo** (\`$branch\`) → \`$kernel\`"$'\n'
                else
                  UPDATEDBRANCHCOUNT=$((UPDATEDBRANCHCOUNT + 1))
                  UPDATEDBRANCH+="- 🔄 **$repo** (\`$branch\`) → \`$kernel\`"$'\n'
                fi
              fi

              f="$(family "$repo")"
              dr="$(display_repo "$repo")"
              dp="$(platform "$repo")"
              db="$(branch_name "$branch" | tr '[:lower:]' '[:upper:]')"
              if (( SUMMARYROWS < SUMMARYLIMIT )); then
                PLATFORM_ROWS["$f"]+="| $dr | $dp | $db | \`${sha:0:7}\` | $kernel | $status |"$'\n'
                FLATCOUNT["$f"]=$(( ${FLATCOUNT[$f]:-0} + 1 ))
                SUMMARYROWS=$((SUMMARYROWS + 1))
              fi
              append_state "$repo" "$branch" "$current"
            done <<< "$BRANCHDATA"
            printf '</details>\n\n' >> "$TARGET"
          done <<< "$REPOS"

          # Detect deleted repositories/branches using the previous state.
          while IFS= read -r repo; do
            [[ -z "$repo" ]] && continue
            is_blacklisted "$repo" && { jq --arg r "$repo" --argjson v "$(jq -c --arg r "$repo" '.[$r] // {}' "$STATEFILE")" '.[$r]=$v' new-state.json > tmp.json; mv tmp.json new-state.json; continue; }
            if jq -e --arg r "$repo" '.[$r] != null' new-state.json >/dev/null 2>&1; then
              while IFS= read -r branch; do
                [[ -z "$branch" ]] && continue
                if ! jq -e --arg r "$repo" --arg b "$branch" '.[$r][$b] != null' new-state.json >/dev/null 2>&1; then
                  DELETEDCOUNT=$((DELETEDCOUNT + 1)); DETECTEDCHANGE=true
                  DELETEDITEM+="- 🗑️ **Branch Deleted:** $repo (\`$branch\`)"$'\n'
                fi
              done < <(jq -r --arg r "$repo" '.[$r] | keys[]' "$STATEFILE" 2>/dev/null || true)
            else
              DELETEDCOUNT=$((DELETEDCOUNT + 1)); DETECTEDCHANGE=true
              DELETEDITEM+="- 🗑️ **Repository Deleted:** $repo"$'\n'
            fi
          done < <(jq -r 'keys[]' "$STATEFILE")

          mv new-state.json "$STATEFILE"

          {
            [[ -n "$NEWREPOS" ]] && printf '### 📂 New Repositories\n\n%b\n' "$NEWREPOS"
            [[ -n "$NEWBRANCH" ]] && printf '### ✨ New Branches\n\n%b\n' "$NEWBRANCH"
            [[ -n "$UPDATEDBRANCH" ]] && printf '### 🔄 Updated Branches\n\n%b\n' "$UPDATEDBRANCH"
            [[ -n "$DELETEDITEM" ]] && printf '### 🗑️ Deleted Items\n\n%b\n' "$DELETEDITEM"
          } > notification.md

          {
            echo '### 📊 OnePlusOSS Kernel Monitor'; echo
            printf '| Metric | Value |\n| :--- | ---: |\n'
            printf '| Repositories Discovered | %s |\n| Repositories Scanned | %s |\n| Repositories Failed | %s |\n| Branches Scanned | %s |\n| New Branches | %s |\n| Updated Branches | %s |\n| Deleted Items | %s |\n\n'               "$TOTALREPOS" "$SCANNEDREPOS" "$FAILEDREPOS" "$TOTALBRANCHES" "$NEWBRANCHCOUNT" "$UPDATEDBRANCHCOUNT" "$DELETEDCOUNT"
            echo '### 🌿 Branch Status & Kernel Versions'; echo
            for f in SM MT MANIFEST OTHER; do
              [[ -z "${PLATFORM_ROWS[$f]:-}" ]] && continue
              case "$f" in
                SM) title='📱 OnePlus-SM Devices' ;;
                MT) title='📱 OnePlus-MT Devices' ;;
                MANIFEST) title='📋 Kernel Manifest' ;;
                *) title='📦 Other' ;;
              esac
              printf '#### %s\n\n> **%s branch(s)**\n\n| Project | Platform | Branch | Latest Commit | Kernel | Status |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n' "$title" "${FLATCOUNT[$f]}" 
              printf '%s' "${PLATFORM_ROWS[$f]}" | sort -t'|' -k3,3V -k2,2
              echo
            done
            if (( SUMMARYROWS >= SUMMARYLIMIT )); then
              printf '> ⚠️ Summary Limited to the First %s Branches\n> Complete Data is Available on the `status-page` Branch\n' "$SUMMARYLIMIT"
            fi
          } > "$GITHUB_STEP_SUMMARY"

          printf 'changes_found=%s\n' "$DETECTEDCHANGE" >> "$GITHUB_OUTPUT"
          echo "📊 Scan Complete: repos=$TOTALREPOS scanned=$SCANNEDREPOS failed=$FAILEDREPOS branches=$TOTALBRANCHES changes=$DETECTEDCHANGE"

      - name: 🔔 Manage Notification Issue
        if: steps.scanner.outputs.changes_found == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          REPO="${{ github.repository }}"
          DATE_TITLE="Kernel Updates - $(date -u +'%Y-%m-%d')"
          RUNURL="${{ github.server_url }}/$REPO/actions/runs/${{ github.run_id }}"
          TARGET="@${REPOSITORYOWNER}"
          [[ "$REPOSITORYOWNER" == WildKernels ]] && TARGET="@WildKernels/oneplus-kernel-devs"

          gh label create notification --color BFD4F2             --description "Automated kernel monitor notification" --repo "$REPO" --force >/dev/null 2>&1 || true

          DETAILS="$(cat main/notification.md 2>/dev/null || true)"
          [[ -n "$DETAILS" ]] || DETAILS="Changes were detected, but no notification details were generated."

          ISSUE="$(gh issue list --repo "$REPO" --label notification --state open             --search "$DATE_TITLE" --json number --jq '.[0].number // empty')"

          if [[ -z "$ISSUE" ]]; then
            gh issue create --repo "$REPO" --title "$DATE_TITLE" --label notification               --body "$(printf 'Hi %s,\n\n%s\n\n---\n🔗 [View Action Summary](%s)' "$TARGET" "$DETAILS" "$RUNURL")"
          else
            gh issue comment "$ISSUE" --repo "$REPO"               --body "$(printf '### 🔄 New Activity Detected (%s UTC)\n\n%s\n\n---\n🔗 [View Action Summary](%s)' "$(date -u +'%H:%M')" "$DETAILS" "$RUNURL")"
          fi

      - name: 📄 Publish Status Page
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          STATUSURL="https://github.com/${{ github.repository }}.git"
          STATUSAPI="repos/${{ github.repository }}/branches/status-page"
          rm -rf repostatus-final
          mkdir -p repostatus-final
          cd repostatus-final
          git init -q
          git remote add origin "$STATUSURL"

          if gh api "$STATUSAPI" --silent >/dev/null 2>&1; then
            gh auth setup-git
            git fetch --quiet origin refs/heads/status-page
            git checkout --quiet -B status-page FETCH_HEAD
          else
            ERROR="$(gh api "$STATUSAPI" --silent 2>&1 || true)"
            if grep -qiE 'Bad credentials|401|403|forbidden|Resource not accessible' <<< "$ERROR"; then
              printf '%s\n' "$ERROR"; exit 1
            fi
            git checkout --quiet --orphan status-page
            git rm -rf . >/dev/null 2>&1 || true
          fi

          {
            echo '# 📱 OnePlusOSS Kernel Tracker'; echo
            echo "> **Last Update:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')"; echo
            echo 'Automated monitoring report for OnePlusOSS Android kernel repositories.'; echo
            echo '---'; echo
            cat ../manifest_summary.md; echo; echo '---'; echo
            cat ../local-summary.md
          } > README.md

          cp "../main/$STATEFILE" "$STATEFILE"
          git add README.md "$STATEFILE"
          if git diff --cached --quiet; then
            echo "ℹ️ No Status-Page Changes Detected"; exit 0
          fi

          git commit --quiet -m 'docs: sync OnePlusOSS kernel status [skip ci]'
          gh auth setup-git
          git push --quiet origin HEAD:status-page || {
            echo "❌ Failed to push status-page"
            echo "Ensure workflow permissions include Contents: Write"
            exit 1
          }
          echo "🏆 Status-Page Updated Successfully"
