name: V6

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

concurrency:
  group: oneplusoss-kernel-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      actions: write

    env:
      ORG: "OnePlusOSS"
      STATEFILE: "old-state.json"
      GH_TOKEN: ${{ github.token }}
      GH_HTTP_TIMEOUT: 600
      MAXRETRIES: 4
      DELAYRETRIES: 5
      SUMMARYLIMIT: 5000
      REPOSITORYOWNER: ${{ github.repository_owner }}

    steps:

      - name: 📥 Checkout Main
        uses: actions/checkout@v6
        with:
          path: main
          fetch-depth: 1

      - name: 🚫 Configure Repository Blacklist
        shell: bash
        run: |
          set -Eeuo pipefail

          cat >> "$GITHUB_ENV" <<'EOF'
          BLREPOS<<BLACKLIST
          android_kernel_oneplus_one
          android_kernel_oneplus_msm8974
          android_kernel_oneplus_msm8994
          android_kernel_oneplus_msm8996
          android_kernel_oneplus_msm8998
          android_kernel_oneplus_sm6350
          android_kernel_oneplus_sm4250
          android_kernel_oneplus_sm7250
          android_kernel_oneplus_sdm845
          android_kernel_oneplus_sm8150
          android_kernel_4.19_oneplus_mt6765
          android_kernel_oneplus_sm8250
          android_kernel_oneplus_mt6893
          android_kernel_oneplus_sm4350
          android_kernel_msm-5.4_oneplus_sm6375
          android_kernel_oneplus_mt6877
          android_kernel_oneplus_sm7325
          android_kernel_oneplus_sm8350
          android_kernel_oneplus_sw5100
          android_kernel_oneplus_sm7225
          BLACKLIST
          EOF

      - name: 💾 Restore Persistent State
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf repostatus

          STATUSURL="https://github.com/${{ github.repository }}.git"
          STATUSAPI="repos/${{ github.repository }}/branches/status-page"

          echo "🔎 Checking status-page branch..."

          # Use GitHub API for branch detection.
          # This avoids git credential prompts from ls-remote.
          if gh api \
            "$STATUSAPI" \
            --silent \
            >/dev/null 2>&1
          then

            echo "✅ status-page branch exists."

            mkdir -p repostatus
            cd repostatus

            git init -q
            git remote add origin "$STATUSURL"

            # Configure Git to use the authenticated GitHub CLI token.
            # This avoids unauthenticated HTTPS prompts from git.
            gh auth setup-git

            git fetch \
              --quiet \
              origin \
              refs/heads/status-page

            git checkout \
              --quiet \
              -B status-page \
              FETCH_HEAD

            cd ..

            if [ -f "repostatus/$STATEFILE" ]; then

              cp \
                "repostatus/$STATEFILE" \
                "main/$STATEFILE"

              echo "✅ Existing state restored."

            else

              echo "ℹ️ status-page exists but $STATEFILE was not found."

              echo "{}" > "main/$STATEFILE"

            fi

          else

            APIERROR="$(
              gh api \
                "$STATUSAPI" \
                --silent \
                2>&1 ||
                true
            )"

            # Never treat an authentication/permission failure
            # as a missing branch.
            if printf '%s\n' "$APIERROR" |
              grep -qiE \
                'Bad credentials|401|403|forbidden|Resource not accessible'
            then

              echo "❌ GitHub token cannot access status-page."
              printf '%s\n' "$APIERROR"
              exit 1

            fi

            echo "ℹ️ status-page does not exist."
            echo "ℹ️ Starting with empty state."

            echo "{}" > "main/$STATEFILE"

            mkdir -p repostatus

          fi

          # Validate state JSON.
          if ! jq -e \
            'type == "object"' \
            "main/$STATEFILE" \
            >/dev/null 2>&1
          then

            echo "⚠️ Invalid state file detected."

            cp \
              "main/$STATEFILE" \
              "main/${STATEFILE}.invalid.$(date +%s)" \
              2>/dev/null ||
              true

            echo "{}" > "main/$STATEFILE"

            echo "✅ State reset."

          fi

      - name: 🔍 Process OnePlusOSS Repositories
        id: scanner
        shell: bash
        run: |
          set -Eeuo pipefail

          cd main

          echo "### 📓 Kernel Manifests Report" > ../manifest_summary.md
          echo "### 🛠 Kernel Trees Report" > ../local-summary.md

          : > notification.md
          : > ../summary-rows.md

          if [ ! -f "$STATEFILE" ] || [ ! -s "$STATEFILE" ]; then
            echo "{}" > "$STATEFILE"
          fi

          echo "{}" > new-state.json

          TOTALREPOS=0
          SCANNEDREPOS=0
          FAILEDREPOS=0
          TOTALBRANCHES=0
          NEWBRANCHCOUNT=0
          UPDATEDBRANCHCOUNT=0
          DELETEDCOUNT=0
          SUMMARYROWS=0

          NEWREPOS=""
          NEWBRANCH=""
          UPDATEDBRANCH=""
          DELETEDITEM=""

          DETECTEDCHANGE="false"

          # Summary groups.
          declare -A PLATFORM_ROWS
          declare -A FLATCOUNT

          explblacklisted() {
            local repo="$1"

            printf '%s\n' "$BLREPOS" |
              grep -Fqx -- "$repo"
          }

          # Map repositories to their display platform.
          #
          # This follows the same style as mapdevice().
          #
          # Explicit mappings can be added whenever a repository
          # needs a custom display name.
          #
          # Generic SM/MT repositories automatically fall back to
          # their detected chipset.
          mapplatform() {
            case "$1" in

              android_kernel_oneplus_mt6893)
                echo "OnePlus-MT6893"
                ;;

              android_kernel_oneplus_mt6877)
                echo "OnePlus-MT6877"
                ;;

              android_kernel_4.19_oneplus_mt6765)
                echo "OnePlus-MT6765"
                ;;

              android_kernel_oneplus_sm4250)
                echo "OnePlus-SM4250"
                ;;

              android_kernel_oneplus_sm4350)
                echo "OnePlus-SM4350"
                ;;

              android_kernel_oneplus_sm6350)
                echo "OnePlus-SM6350"
                ;;

              android_kernel_oneplus_sm7325)
                echo "OnePlus-SM7325"
                ;;

              android_kernel_oneplus_sm7225)
                echo "OnePlus-SM7225"
                ;;

              android_kernel_oneplus_sm8150)
                echo "OnePlus-SM8150"
                ;;

              android_kernel_oneplus_sm8250)
                echo "OnePlus-SM8250"
                ;;

              android_kernel_oneplus_sm8350)
                echo "OnePlus-SM8350"
                ;;

              android_kernel_oneplus_sm8450)
                echo "OnePlus-SM8450"
                ;;

              android_kernel_oneplus_sm8550)
                echo "OnePlus-SM8550"
                ;;

              android_kernel_oneplus_sm8650)
                echo "OnePlus-SM8650"
                ;;

              android_kernel_oneplus_sm8750)
                echo "OnePlus-SM8750"
                ;;

              android_kernel_oneplus_sm8850)
                echo "OnePlus-SM8850"
                ;;

              kernel_manifest)
                echo "OnePlusOSS"
                ;;

              *)
                local platform=""

                platform="$(
                  printf '%s\n' "$1" |
                    grep -oEi '(sm|mt)[0-9]{4,5}' |
                    head -n1 |
                    tr '[:lower:]' '[:upper:]' ||
                    true
                )"

                if [ -n "$platform" ]; then
                  echo "OnePlus-$platform"
                else
                  echo "OTHER"
                fi
                ;;

            esac
          }

          # Map OnePlus branch names to compact device/version names
          # for the GitHub Actions Summary.
          #
          # Examples:
          # oneplus/sm6375_b_16.0.0_nord_ce4_lite_5g
          #   -> Nord CE4 Lite 5G-B-16.0.0
          #
          # oneplus/sm8650_b_16.0.0_ace_3_pro
          #   -> Ace 3 Pro-B-16.0.0
          #
          # Explicit mappings are checked first. Unknown OnePlus
          # branches then use the generic parser below, so new
          # device branches do not remain as raw branch names.

          mapbranch() {
            local branch="$1"
            local short="${branch#oneplus/}"
            local variant=""
            local version=""
            local device=""
            local mapped_device=""
            local chipset=""

            case "$branch" in
              # Current Android 14/15/16 branch mappings.
              oneplus/sm6375_b_16.0.0_nord_ce4_lite_5g) echo "Nord CE4 Lite 5G-B-16.0.0"; return ;;
              oneplus/sm6375_v_15.0.0_nord_ce4_lite_5g) echo "Nord CE4 Lite 5G-V-15.0.0"; return ;;
              oneplus/sm6375_u_14.0.1_nord_ce4_lite_5g) echo "Nord CE4 Lite 5G-U-14.0.1"; return ;;
              oneplus/sm6375_v_15.0.0_nord_ce3_lite_5g) echo "Nord CE3 Lite 5G-V-15.0.0"; return ;;
              oneplus/sm7550_b_16.0.0_nord_ce4) echo "Nord CE4-B-16.0.0"; return ;;
              oneplus/sm7550_v_15.0.0_nord_ce4) echo "Nord CE4-V-15.0.0"; return ;;
              oneplus/sm7550_u_14.0.1_oneplus_nord_ce4) echo "Nord CE4-U-14.0.1"; return ;;
              oneplus/sm7635_b_16.0.0_nord_ce6) echo "Nord CE6-B-16.0.0"; return ;;
              oneplus/sm7635_b_16.0.0_turbo_6v) echo "Turbo 6V-B-16.0.0"; return ;;
              oneplus/sm7675_b_16.0.0_ace_3v) echo "Ace 3V-B-16.0.0"; return ;;
              oneplus/sm7675_b_16.0.0_nord_4) echo "Nord 4-B-16.0.0"; return ;;
              oneplus/sm7675_v_15.0.0_ace_3v) echo "Ace 3V-V-15.0.0"; return ;;
              oneplus/sm7675_v_15.0.0_nord_4) echo "Nord 4-V-15.0.0"; return ;;
              oneplus/sm7675_u_14.0.1_oneplus_ace3v) echo "Ace 3V-U-14.0.1"; return ;;
              oneplus/sm7675_u_14.1.0_oneplus_nord4) echo "Nord 4-U-14.1.0"; return ;;
              # Legacy SM8550 branches.
              oneplus/sm8550_t_13.1.0_oneplus11) echo "OnePlus 11-T-13.1.0"; return ;;
              oneplus/sm8550_t_13.1_ace2pro) echo "Ace 2 Pro-T-13.1"; return ;;
              oneplus/sm8550_t_13.2_open) echo "Open-T-13.2"; return ;;
              oneplus_sm8550_t_13.0_oneplus_11) echo "OnePlus 11-T-13.0"; return ;;

              # Legacy SM8475 branches.
              oneplus/sm8475_s_12.1_oneplus_10t_5g) echo "OnePlus 10T 5G-S-12.1"; return ;;
              oneplus/sm8475_t_13.0.0_ace_pro) echo "Ace Pro-T-13.0.0"; return ;;
              oneplus/sm8475_t_13.1.0_11r_5g) echo "OnePlus 11R 5G-T-13.1.0"; return ;;
              oneplus_sm8475_t_13.0_oneplus_11R_5G) echo "OnePlus 11R 5G-T-13.0"; return ;;

              # Legacy SM8450 branches.
              oneplus/sm8450_s_12.1_10_pro) echo "OnePlus 10 Pro-S-12.1"; return ;;
              oneplus/sm8450_t_13.0_10pro) echo "OnePlus 10 Pro-T-13.0"; return ;;
              oneplus/sm8450_t_13.1.0_10pro) echo "OnePlus 10 Pro-T-13.1.0"; return ;;

              oneplus/sm8650_b_16.0.0_ace_3_pro) echo "Ace 3 Pro-B-16.0.0"; return ;;
              oneplus/sm8750_b_16.0.0_oneplus_13) echo "OnePlus 13-B-16.0.0"; return ;;
              oneplus/sm8750_b_16.0.0_oneplus_13s) echo "OnePlus 13S-B-16.0.0"; return ;;
              oneplus/sm8750_b_16.0.0_oneplus_13t) echo "OnePlus 13T-B-16.0.0"; return ;;
              oneplus/sm8750_b_16.0.0_ace_5_pro) echo "Ace 5 Pro-B-16.0.0"; return ;;
              oneplus/sm8750_b_16.0.0_ace_6) echo "Ace 6-B-16.0.0"; return ;;
              oneplus/sm8750_b_16.0.0_pad_2_pro) echo "Pad 2 Pro-B-16.0.0"; return ;;
              oneplus/sm8750_b_16.0.0_pad_3) echo "Pad 3-B-16.0.0"; return ;;
              oneplus/sm8750_b_16.0.0_oneplus_12) echo "OnePlus 12-B-16.0.0"; return ;;

              # Legacy MT6895 branch names.
              10r-U-14.0.0) echo "OnePlus 10R-U-14.0.0"; return ;;
              Ace\ Race-U-14.0.0) echo "Ace Race-U-14.0.0"; return ;;
              Ace\ Race-V-15.0.0) echo "Ace Race-V-15.0.0"; return ;;
              Ace-U-14.0.0) echo "Ace-U-14.0.0"; return ;;
              Ace-V-15.0.0) echo "Ace-V-15.0.0"; return ;;
              Oneplus\ 10r-V-15.0.0) echo "OnePlus 10R-V-15.0.0"; return ;;
              mt6895_t_13.1.0_oneplus_ace) echo "Ace-T-13.1.0"; return ;;
              oneplus/mt6895_s_12.1_oneplus_10r) echo "OnePlus 10R-S-12.1"; return ;;
              oneplus/mt6895_s_12.1_oneplus_ace_race) echo "Ace Race-S-12.1"; return ;;
              oneplus/mt6895_t_13.0.0) echo "MT6895-T-13.0.0"; return ;;
              oneplus/mt6895_t_13.0.0_ace_racing) echo "Ace Racing-T-13.0.0"; return ;;

              # Legacy MT6983 branch names.
              oneplus/mt6983_t_13.0_oneplus_ace_2v) echo "Ace 2V-T-13.0"; return ;;
              oneplus/mt6983_t_13.1.0_onepluspad) echo "OnePlus Pad-T-13.1.0"; return ;;
              oneplus/mt6983_t_13.1_oneplus_nord_3_5g) echo "Nord 3 5G-T-13.1"; return ;;
              oneplus_mt6983_u_14.0.0_nord_3_5g) echo "Nord 3 5G-U-14.0.0"; return ;;
              oneplus_mt6983_u_14.0.0_oneplus_ace_2v) echo "Ace 2V-U-14.0.0"; return ;;
              Ace\ 2v-U-14.0.0) echo "OnePlus Ace 2V-U-14.0.0"; return ;;
            esac

            # Kernel manifest branches are chipset manifests rather than
            # device kernel branches.
            if [ "$branch" = "oneplus/sm6375" ]; then echo "OnePlus-6375"; return; fi
            if [ "$branch" = "oneplus/sm7550" ]; then echo "OnePlus-7550"; return; fi
            if [ "$branch" = "oneplus/sm7635" ]; then echo "OnePlus-7635"; return; fi
            if [ "$branch" = "oneplus/sm7675" ]; then echo "OnePlus-7675"; return; fi
            if [ "$branch" = "oneplus/sm8450" ]; then echo "OnePlus-8450"; return; fi
            if [ "$branch" = "oneplus/sm8475" ]; then echo "OnePlus-8475"; return; fi
            if [ "$branch" = "oneplus/sm8550" ]; then echo "OnePlus-8550"; return; fi
            if [ "$branch" = "oneplus/sm8635" ]; then echo "OnePlus-8635"; return; fi
            if [ "$branch" = "oneplus/sm8650" ]; then echo "OnePlus-8650"; return; fi
            if [ "$branch" = "oneplus/sm8735" ]; then echo "OnePlus-8735"; return; fi
            if [ "$branch" = "oneplus/sm8750" ]; then echo "OnePlus-8750"; return; fi
            if [ "$branch" = "oneplus/sm8845" ]; then echo "OnePlus-8845"; return; fi
            if [ "$branch" = "oneplus/sm8850" ]; then echo "OnePlus-8850"; return; fi

            # Generic kernel-manifest branch mapping.
            # Example: oneplus/sm6375 -> OnePlus-6375.
            if [[ "$branch" =~ ^oneplus/(sm|mt)([0-9]{4,5})$ ]]; then
              echo "OnePlus-${BASH_REMATCH[2]}"
              return
            fi

            # Generic parser supports both:
            #   oneplus/mtXXXX_...
            #   oneplus_mtXXXX_...
            # and SM equivalents.
            if [[ "$branch" =~ ^(oneplus/|oneplus_)?(sm|mt)([0-9]{4,5})_(.+)$ ]]; then
              chipset="${BASH_REMATCH[2]}${BASH_REMATCH[3]}"
              short="${BASH_REMATCH[4]}"
            else
              echo "$branch"
              return
            fi

            if [[ "$short" =~ ^(b|u|v)_([0-9]+\.[0-9]+(\.[0-9]+)?)_(.+)$ ]]; then
              variant="${BASH_REMATCH[1]}"
              version="${BASH_REMATCH[2]}"
              device="${BASH_REMATCH[4]}"
            else
              # Legacy branches may use t/s before the Android version.
              if [[ "$short" =~ ^(s|t)_([0-9]+\.[0-9]+(\.[0-9]+)?)_?(.*)$ ]]; then
                variant="${BASH_REMATCH[1]}"
                version="${BASH_REMATCH[2]}"
                device="${BASH_REMATCH[4]}"
              else
                echo "$branch"
                return
              fi
            fi

            # Normalize branch device slugs before matching so legacy
            # branches containing OnePlus_11R_5G, etc. are handled.
            device="$(printf '%s' "$device" | tr '[:upper:]' '[:lower:]')"

            case "$device" in
              nord_ce4_lite_5g) mapped_device="Nord CE4 Lite 5G" ;;
              nord_ce3_lite_5g) mapped_device="Nord CE3 Lite 5G" ;;
              nord_ce4) mapped_device="Nord CE4" ;;
              nord_ce6) mapped_device="Nord CE6" ;;
              nord_3_5g) mapped_device="Nord 3 5G" ;;
              nord_4|nord4) mapped_device="Nord 4" ;;
              turbo_6v) mapped_device="Turbo 6V" ;;
              ace_2v|ace2v) mapped_device="Ace 2V" ;;
              ace_3v|ace3v) mapped_device="Ace 3V" ;;
              ace_3_pro) mapped_device="Ace 3 Pro" ;;
              ace_5_pro) mapped_device="Ace 5 Pro" ;;
              ace_6) mapped_device="Ace 6" ;;
              ace_race) mapped_device="Ace Race" ;;
              ace_racing) mapped_device="Ace Racing" ;;
              oneplus_13) mapped_device="OnePlus 13" ;;
              oneplus_13s) mapped_device="OnePlus 13S" ;;
              oneplus_13t) mapped_device="OnePlus 13T" ;;
              oneplus_12) mapped_device="OnePlus 12" ;;
              oneplus_11|oneplus11) mapped_device="OnePlus 11" ;;
              oneplus_11r_5g|11r_5g) mapped_device="OnePlus 11R 5G" ;;
              oneplus_10_pro|10_pro|10pro) mapped_device="OnePlus 10 Pro" ;;
              oneplus_10t_5g|10t_5g) mapped_device="OnePlus 10T 5G" ;;
              oneplus_10t|10t) mapped_device="OnePlus 10T" ;;
              ace_2_pro|ace2pro) mapped_device="Ace 2 Pro" ;;
              ace_pro) mapped_device="Ace Pro" ;;
              oneplus_10r|10r) mapped_device="OnePlus 10R" ;;
              oneplus_ace) mapped_device="OnePlus Ace" ;;
              onepluspad|oneplus_pad) mapped_device="OnePlus Pad" ;;
              pad_2_pro) mapped_device="Pad 2 Pro" ;;
              pad_3) mapped_device="Pad 3" ;;
              *)
                mapped_device="$(printf '%s' "$device" | sed -E 's/^oneplus_//; s/_/ /g')"
                mapped_device="$(printf '%s' "$mapped_device" | awk '{for(i=1;i<=NF;i++){$i=toupper(substr($i,1,1)) substr($i,2)} print}')"
                ;;
            esac

            printf '%s-%s-%s\n' \
              "$mapped_device" \
              "$(printf '%s' "$variant" | tr '[:lower:]' '[:upper:]')" \
              "$version"
          }

          # Determine the summary family.
          #
          # Every SM device goes into one SM section.
          # Every MT device goes into one MT section.
          #
          # Example:
          #
          # SM8450
          # SM8650
          # SM8750
          # SM8850
          #
          # all become:
          #
          # OnePlus-SM Devices
          #
          # Likewise all MT devices become:
          #
          # OnePlus-MT Devices
          mapfamily() {
            case "$1" in

              android_kernel_oneplus_sm*|\
              android_kernel_common_oneplus_sm*)
                echo "SM"
                ;;

              android_kernel_oneplus_mt*|\
              android_kernel_common_oneplus_mt*|\
              android_kernel_4.19_oneplus_mt*)
                echo "MT"
                ;;

              kernel_manifest)
                echo "MANIFEST"
                ;;

              *)
                if printf '%s\n' "$1" |
                  grep -qiE '(sm|mt)[0-9]{4,5}'
                then

                  if printf '%s\n' "$1" |
                    grep -qiE 'sm[0-9]{4,5}'
                  then
                    echo "SM"
                  else
                    echo "MT"
                  fi

                else

                  echo "OTHER"

                fi
                ;;

            esac
          }

          KERNELQUERY='
          query($name: String!, $owner: String!, $cursor: String) {
            repository(name: $name, owner: $owner) {
              refs(
                refPrefix: "refs/heads/"
                first: 100
                after: $cursor
                orderBy: {
                  field: ALPHABETICAL
                  direction: ASC
                }
              ) {
                nodes {
                  name
                  target {
                    ... on Commit {
                      oid
                      message
                      file(path: "Makefile") {
                        ... on TreeEntry {
                          object {
                            ... on Blob {
                              text
                            }
                          }
                        }
                      }
                    }
                  }
                }
                pageInfo {
                  endCursor
                  hasNextPage
                }
              }
            }
          }'

          MANIFESTQUERY='
          query($name: String!, $owner: String!, $cursor: String) {
            repository(name: $name, owner: $owner) {
              refs(
                refPrefix: "refs/heads/"
                first: 100
                after: $cursor
                orderBy: {
                  field: ALPHABETICAL
                  direction: ASC
                }
              ) {
                nodes {
                  name
                  target {
                    ... on Commit {
                      oid
                      message
                      tree {
                        entries {
                          name
                          oid
                        }
                      }
                    }
                  }
                }
                pageInfo {
                  endCursor
                  hasNextPage
                }
              }
            }
          }'

          echo "🔎 Discovering OnePlusOSS repositories..."

          REPOS="$(
            gh repo list "$ORG" \
              --limit 1000 \
              --json name \
              --jq '
                .[]
                | select(
                    (
                      .name == "kernel_manifest"
                      or
                      (.name | startswith("android_kernel_"))
                    )
                    and
                    ((.name | contains("modules")) | not)
                    and
                    ((.name | contains("techpack")) | not)
                  )
                | .name
              '
          )"

          if [ -z "$REPOS" ]; then
            echo "❌ Unable to retrieve OnePlusOSS repositories."
            exit 1
          fi

          TOTALREPOS="$(
            printf '%s\n' "$REPOS" |
              sed '/^[[:space:]]*$/d' |
              wc -l
          )"

          echo "📊 Found $TOTALREPOS repositories."

          while IFS= read -r repo; do

            [ -z "$repo" ] && continue

            if explblacklisted "$repo"; then
              echo "🚫 Skipping blacklisted repository: $repo"
              continue
            fi

            echo
            echo "📂 Processing: $repo"

            if [ "$repo" = "kernel_manifest" ]; then
              ACTIVEQUERY="$MANIFESTQUERY"
              TARGETQUERY="../manifest_summary.md"
            else
              ACTIVEQUERY="$KERNELQUERY"
              TARGETQUERY="../local-summary.md"
            fi

            if jq -e \
              --arg repo "$repo" \
              '.[$repo] != null' \
              "$STATEFILE" \
              >/dev/null 2>&1
            then
              OLDREPO="true"
            else
              OLDREPO="false"
            fi

            BRANCHDATA=""
            CURSOR=""
            PAGE=0
            FILESCANNED="false"

            while true; do

              PAGE=$((PAGE + 1))
              RESPONSE=""
              REQUESTOK="false"

              for attempt in $(seq 1 "$MAXRETRIES"); do

                echo "  🌐 GraphQL page $PAGE, attempt $attempt/$MAXRETRIES"

                if [ -z "$CURSOR" ]; then

                  RESPONSE="$(
                    gh api graphql \
                      -f query="$ACTIVEQUERY" \
                      -f owner="$ORG" \
                      -f name="$repo" \
                      2>&1
                  )" || true

                else

                  RESPONSE="$(
                    gh api graphql \
                      -f query="$ACTIVEQUERY" \
                      -f owner="$ORG" \
                      -f name="$repo" \
                      -f cursor="$CURSOR" \
                      2>&1
                  )" || true

                fi

                if [ -n "$RESPONSE" ] &&
                   jq -e '
                     ((.errors // []) | length == 0)
                     and
                     (.data.repository != null)
                   ' <<< "$RESPONSE" \
                   >/dev/null 2>&1
                then

                  REQUESTOK="true"
                  break

                fi

                echo "  ⚠️ GraphQL request failed."

                if [ -n "$RESPONSE" ]; then

                  ERRORS="$(
                    jq -r \
                      '.errors[]?.message // empty' \
                      <<< "$RESPONSE" \
                      2>/dev/null ||
                      true
                  )"

                  if [ -n "$ERRORS" ]; then
                    printf '%s\n' "$ERRORS"
                  else
                    printf '%s\n' "$RESPONSE" |
                      head -c 1000
                    echo
                  fi

                fi

                if [ "$attempt" -lt "$MAXRETRIES" ]; then

                  RETRYWAIT=$((DELAYRETRIES * attempt))

                  echo "  ⏳ Retrying in ${RETRYWAIT}s..."

                  sleep "$RETRYWAIT"

                fi

              done

              if [ "$REQUESTOK" != "true" ]; then

                echo "  ❌ Unable to retrieve page $PAGE for $repo."

                FILESCANNED="false"
                break

              fi

              PAGENODES="$(
                jq -c \
                  '.data.repository.refs.nodes[]?' \
                  <<< "$RESPONSE"
              )"

              if [ -n "$PAGENODES" ]; then

                if [ -n "$BRANCHDATA" ]; then
                  BRANCHDATA+=$'\n'
                fi

                BRANCHDATA+="$PAGENODES"

              fi

              HASNEXT="$(
                jq -r \
                  '.data.repository.refs.pageInfo.hasNextPage' \
                  <<< "$RESPONSE"
              )"

              NEXTCURSOR="$(
                jq -r \
                  '.data.repository.refs.pageInfo.endCursor // empty' \
                  <<< "$RESPONSE"
              )"

              if [ "$HASNEXT" != "true" ]; then

                FILESCANNED="true"
                break

              fi

              if [ -z "$NEXTCURSOR" ]; then

                echo "  ❌ Pagination requested but no cursor was returned."

                FILESCANNED="false"
                break

              fi

              CURSOR="$NEXTCURSOR"

            done

            # Never overwrite valid previous state with an incomplete scan.
            if [ "$FILESCANNED" != "true" ]; then

              FAILEDREPOS=$((FAILEDREPOS + 1))

              echo "  ⚠️ Scan failed: $repo"

              if [ "$OLDREPO" = "true" ]; then

                echo "  🛡️ Preserving previous state."

                OLDREPOSTATE="$(
                  jq -c \
                    --arg repo "$repo" \
                    '.[$repo] // {}' \
                    "$STATEFILE"
                )"

                jq \
                  --arg repo "$repo" \
                  --argjson old "$OLDREPOSTATE" \
                  '.[$repo] = $old' \
                  new-state.json \
                  > tmp.json

                mv tmp.json new-state.json

              fi

              continue

            fi

            SCANNEDREPOS=$((SCANNEDREPOS + 1))

            if [ "$OLDREPO" = "false" ]; then

              NEWREPOS+="- 🆕 **$repo**"$'\n'

              DETECTEDCHANGE="true"

            fi

            printf '<details><summary><b>%s</b></summary>\n\n' "$repo" \
              >> "$TARGETQUERY"

            while IFS= read -r row; do

              [ -z "$row" ] && continue

              BRANCHNAME="$(jq -r '.name // empty' <<< "$row")"
              SHA="$(jq -r '.target.oid // empty' <<< "$row")"

              [ -z "$BRANCHNAME" ] && continue
              [ -z "$SHA" ] && continue

              MSG="$(
                jq -r '.target.message // empty' <<< "$row" |
                  head -n1 |
                  tr '\r\n' ' ' |
                  cut -c1-200 |
                  sed 's/[|`]/ /g'
              )"

              TOTALBRANCHES=$((TOTALBRANCHES + 1))

              OLDVALUE="$(
                jq -r \
                  --arg repo "$repo" \
                  --arg branch "$BRANCHNAME" \
                  '.[$repo][$branch] // "NONE"' \
                  "$STATEFILE"
              )"

              STATUS="✅"
              KERNEL="N/A"
              CURRENTVALUE=""

              if [ "$repo" = "kernel_manifest" ]; then

                JSONFILE="$(
                  jq -c '
                    (.target.tree.entries // [])
                    | reduce .[] as $item
                        ({};
                         .[$item.name] = $item.oid)
                  ' <<< "$row"
                )"

                CURRENTVALUE="$SHA|$JSONFILE"

                if [ "$OLDVALUE" = "NONE" ]; then
                  STATUS="🆕"
                elif [ "$OLDVALUE" != "$CURRENTVALUE" ]; then
                  STATUS="🔄 Updated"
                fi

                {
                  printf '#### Branch: `%s` %s\n' \
                    "$BRANCHNAME" \
                    "$STATUS"

                  printf '* **Latest Commit:** `%s`\n\n' \
                    "${SHA:0:7}"

                  printf '| File Name | Status |\n'
                  printf '| :--- | :--- |\n'

                  while IFS=$'\t' read -r fname foid; do

                    [ -z "$fname" ] && continue

                    FILESTATUS="✅"
                    OLDOID="NONE"

                    if [ "$OLDVALUE" != "NONE" ]; then

                      OLDFILES="$(
                        printf '%s' "$OLDVALUE" |
                          cut -d'|' -f2- |
                          jq -c '.' 2>/dev/null ||
                          echo '{}'
                      )"

                      OLDOID="$(
                        jq -r \
                          --arg file "$fname" \
                          '.[$file] // "NONE"' \
                          <<< "$OLDFILES"
                      )"

                    fi

                    if [ "$OLDOID" = "NONE" ]; then
                      FILESTATUS="🆕 New"
                    elif [ "$OLDOID" != "$foid" ]; then
                      FILESTATUS="📝 Modified"
                    fi

                    printf '| `%s` | %s |\n' \
                      "$fname" \
                      "$FILESTATUS"

                  done < <(
                    jq -r '
                      (.target.tree.entries // [])
                      | .[]
                      | "\(.name)\t\(.oid)"
                    ' <<< "$row"
                  )

                  printf '\n---\n\n'

                } >> "$TARGETQUERY"

                KERNEL="MANIFEST"

              else

                MAKEFILE_TEXT="$(
                  jq -r \
                    '.target.file.object.text // empty' \
                    <<< "$row"
                )"

                if [ -n "$MAKEFILE_TEXT" ]; then

                  VERSION="$(
                    printf '%s\n' "$MAKEFILE_TEXT" |
                      grep -oE \
                        '^VERSION[[:space:]]*=[[:space:]]*[0-9]+' |
                      grep -oE '[0-9]+' |
                      head -n1 ||
                      true
                  )"

                  PATCHLEVEL="$(
                    printf '%s\n' "$MAKEFILE_TEXT" |
                      grep -oE \
                        '^PATCHLEVEL[[:space:]]*=[[:space:]]*[0-9]+' |
                      grep -oE '[0-9]+' |
                      head -n1 ||
                      true
                  )"

                  SUBLEVEL="$(
                    printf '%s\n' "$MAKEFILE_TEXT" |
                      grep -oE \
                        '^SUBLEVEL[[:space:]]*=[[:space:]]*[0-9]+' |
                      grep -oE '[0-9]+' |
                      head -n1 ||
                      true
                  )"

                  if [ -n "$VERSION" ] &&
                     [ -n "$PATCHLEVEL" ]; then

                    KERNEL="$VERSION.$PATCHLEVEL"

                    if [ -n "$SUBLEVEL" ]; then
                      KERNEL+=".${SUBLEVEL}"
                    fi

                  fi

                fi

                CURRENTVALUE="$SHA|$KERNEL"

                if [ "$OLDVALUE" = "NONE" ]; then
                  STATUS="🆕"
                elif [ "$OLDVALUE" != "$CURRENTVALUE" ]; then
                  STATUS="🔄 Updated"
                fi

                {
                  printf '#### Branch: `%s` %s\n' \
                    "$BRANCHNAME" \
                    "$STATUS"

                  printf '* **Kernel Version:** `%s`\n' "$KERNEL"
                  printf '* **Commit SHA:** `%s`\n' "${SHA:0:7}"
                  printf '* **Message:** %s\n\n' "$MSG"
                  printf '%s\n\n' "---"

                } >> "$TARGETQUERY"

              fi

              if [ "$STATUS" != "✅" ]; then

                DETECTEDCHANGE="true"

                if [ "$STATUS" = "🆕" ]; then

                  NEWBRANCHCOUNT=$((NEWBRANCHCOUNT + 1))

                  NEWBRANCH+="- ✨ **$repo** (\`$BRANCHNAME\`) → \`$KERNEL\`"$'\n'

                else

                  UPDATEDBRANCHCOUNT=$((UPDATEDBRANCHCOUNT + 1))

                  UPDATEDBRANCH+="- 🔄 **$repo** (\`$BRANCHNAME\`) → \`$KERNEL\`"$'\n'

                fi

              fi

              # Determine family.
              FAMILY="$(mapfamily "$repo")"

              # Determine readable device/platform name.
              DISPLAYPLATFORM="$(mapplatform "$repo")"

              # Display only the chipset in the Repo column.
              # Keep the real repository name unchanged for API/state operations.
              case "$repo" in
                android_kernel_common_oneplus_sm*|android_kernel_oneplus_sm*)
                  CHIPSET="$(printf '%s\n' "$repo" | grep -oEi 'sm[0-9]{4,5}' | head -n1 | tr '[:lower:]' '[:upper:]' || true)"
                  DISPLAYREPO="${CHIPSET:-$repo}"
                  ;;
                android_kernel_common_oneplus_mt*|android_kernel_oneplus_mt*|android_kernel_4.19_oneplus_mt*)
                  CHIPSET="$(printf '%s\n' "$repo" | grep -oEi 'mt[0-9]{4,5}' | head -n1 | tr '[:lower:]' '[:upper:]' || true)"
                  DISPLAYREPO="${CHIPSET:-$repo}"
                  ;;
                kernel_manifest)
                  DISPLAYREPO="OnePlusOSS"
                  ;;
                *)
                  DISPLAYREPO="$repo"
                  ;;
              esac

              # Map the branch name for the GitHub Summary.
              DISPLAYBRANCH="$(mapbranch "$BRANCHNAME")"

              if [ "$SUMMARYROWS" -lt "$SUMMARYLIMIT" ]; then
                ROW="$(
                  printf '| %s | %s | %s | `%s` | %s | %s |' \
                    "$DISPLAYREPO" \
                    "$DISPLAYPLATFORM" \
                    "$DISPLAYBRANCH" \
                    "${SHA:0:7}" \
                    "$KERNEL" \
                    "$STATUS"
                )"

                PLATFORM_ROWS["$FAMILY"]+="${ROW}"$'\n'

                FLATCOUNT["$FAMILY"]=$(( ${FLATCOUNT[$FAMILY]:-0} + 1 ))
                SUMMARYROWS=$((SUMMARYROWS + 1))
              fi

              jq \
                --arg repo "$repo" \
                --arg branch "$BRANCHNAME" \
                --arg value "$CURRENTVALUE" \
                '.[$repo][$branch] = $value' \
                new-state.json \
                > tmp.json

              mv tmp.json new-state.json

            done <<< "$BRANCHDATA"

            printf '</details>\n\n' >> "$TARGETQUERY"

          done <<< "$REPOS"

          echo
          echo "🧹 Checking deleted repositories and branches..."

          while IFS= read -r old_repo; do

            [ -z "$old_repo" ] && continue

            if explblacklisted "$old_repo"; then

              OLDREPOSTATE="$(
                jq -c \
                  --arg repo "$old_repo" \
                  '.[$repo] // {}' \
                  "$STATEFILE"
              )"

              jq \
                --arg repo "$old_repo" \
                --argjson old "$OLDREPOSTATE" \
                '.[$repo] = $old' \
                new-state.json \
                > tmp.json

              mv tmp.json new-state.json

              continue

            fi

            if jq -e \
              --arg repo "$old_repo" \
              '.[$repo] != null' \
              new-state.json \
              >/dev/null 2>&1
            then

              while IFS= read -r old_branch; do

                [ -z "$old_branch" ] && continue

                if ! jq -e \
                  --arg repo "$old_repo" \
                  --arg branch "$old_branch" \
                  '.[$repo][$branch] != null' \
                  new-state.json \
                  >/dev/null 2>&1
                then

                  DELETEDCOUNT=$((DELETEDCOUNT + 1))
                  DETECTEDCHANGE="true"

                  DELETEDITEM+="- 🗑️ **Branch Deleted:** $old_repo (\`$old_branch\`)"$'\n'

                fi

              done < <(
                jq -r \
                  --arg repo "$old_repo" \
                  '.[$repo] | keys[]' \
                  "$STATEFILE" \
                  2>/dev/null ||
                  true
              )

            else

              DELETEDCOUNT=$((DELETEDCOUNT + 1))
              DETECTEDCHANGE="true"

              DELETEDITEM+="- 🗑️ **Repository Deleted:** $old_repo"$'\n'

            fi

          done < <(
            jq -r 'keys[]' "$STATEFILE"
          )

          mv new-state.json "$STATEFILE"

          {
            if [ -n "$NEWREPOS" ]; then
              echo "### 📂 New Repositories"
              echo
              printf '%b\n' "$NEWREPOS"
            fi

            if [ -n "$NEWBRANCH" ]; then
              echo "### ✨ New Branches"
              echo
              printf '%b\n' "$NEWBRANCH"
            fi

            if [ -n "$UPDATEDBRANCH" ]; then
              echo "### 🔄 Updated Branches"
              echo
              printf '%b\n' "$UPDATEDBRANCH"
            fi

            if [ -n "$DELETEDITEM" ]; then
              echo "### 🗑️ Deleted Items"
              echo
              printf '%b\n' "$DELETEDITEM"
            fi

          } > notification.md

          {
            echo "### 📊 OnePlusOSS Kernel Monitor"
            echo

            echo "| Metric | Value |"
            echo "| :--- | ---: |"
            echo "| Repositories discovered | $TOTALREPOS |"
            echo "| Repositories scanned | $SCANNEDREPOS |"
            echo "| Repositories failed | $FAILEDREPOS |"
            echo "| Branches scanned | $TOTALBRANCHES |"
            echo "| New branches | $NEWBRANCHCOUNT |"
            echo "| Updated branches | $UPDATEDBRANCHCOUNT |"
            echo "| Deleted items | $DELETEDCOUNT |"
            echo

            echo "### 🌿 Branch Status & Kernel Versions"
            echo

            if [ -n "${PLATFORM_ROWS[SM]:-}" ]; then

              COUNT="${FLATCOUNT[SM]:-0}"

              echo "#### 📱 OnePlus-SM Devices"
              echo

              echo "> **$COUNT branch(s)**"
              echo

              echo "| Repo | Platform | Branch | Latest Commit | Kernel | Status |"
              echo "| :--- | :--- | :--- | :--- | :--- | :--- |"

              # Sort SM rows by platform and repository.
              printf '%s' "${PLATFORM_ROWS[SM]}" |
                sort -t'|' -k3,3V -k2,2

              echo

            fi

            if [ -n "${PLATFORM_ROWS[MT]:-}" ]; then

              COUNT="${FLATCOUNT[MT]:-0}"

              echo "#### 📱 OnePlus-MT Devices"
              echo

              echo "> **$COUNT branch(s)**"
              echo

              echo "| Repo | Platform | Branch | Latest Commit | Kernel | Status |"
              echo "| :--- | :--- | :--- | :--- | :--- | :--- |"

              # Sort MT rows by platform and repository.
              printf '%s' "${PLATFORM_ROWS[MT]}" |
                sort -t'|' -k3,3V -k2,2

              echo

            fi

            if [ -n "${PLATFORM_ROWS[MANIFEST]:-}" ]; then

              COUNT="${FLATCOUNT[MANIFEST]:-0}"

              echo "#### 📋 Kernel Manifest"
              echo

              echo "> **$COUNT branch(s)**"
              echo

              echo "| Repo | Platform | Branch | Latest Commit | Kernel | Status |"
              echo "| :--- | :--- | :--- | :--- | :--- | :--- |"

              printf '%s' "${PLATFORM_ROWS[MANIFEST]}"

              echo

            fi

            if [ -n "${PLATFORM_ROWS[OTHER]:-}" ]; then

              COUNT="${FLATCOUNT[OTHER]:-0}"

              echo "#### 📦 Other"
              echo

              echo "> **$COUNT branch(s)**"
              echo

              echo "| Repo | Platform | Branch | Latest Commit | Kernel | Status |"
              echo "| :--- | :--- | :--- | :--- | :--- | :--- |"

              printf '%s' "${PLATFORM_ROWS[OTHER]}"

              echo

            fi

            if [ "$SUMMARYROWS" -ge "$SUMMARYLIMIT" ]; then

              echo
              echo "> ⚠️ Summary limited to the first $SUMMARYLIMIT branches."
              echo "> Full data is available on the \`status-page\` branch."

            fi

          } > "$GITHUB_STEP_SUMMARY"

          echo "changes_found=$DETECTEDCHANGE" >> "$GITHUB_OUTPUT"

          echo
          echo "📊 Scan Complete"
          echo "Repositories discovered : $TOTALREPOS"
          echo "Repositories scanned    : $SCANNEDREPOS"
          echo "Repositories failed     : $FAILEDREPOS"
          echo "Branches scanned        : $TOTALBRANCHES"
          echo "New branches            : $NEWBRANCHCOUNT"
          echo "Updated branches        : $UPDATEDBRANCHCOUNT"
          echo "Deleted items           : $DELETEDCOUNT"
          echo "Changes detected        : $DETECTEDCHANGE"

      - name: 🔔 Manage Notification Issue
        if: steps.scanner.outputs.changes_found == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          gh label create \
            "notification" \
            --color "BFD4F2" \
            --description "Automated kernel monitor notification" \
            --repo "${{ github.repository }}" \
            --force \
            >/dev/null 2>&1 ||
            true

          DATETITLE="Kernel Updates - $(date -u +'%Y-%m-%d')"

          RUNURL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "$REPOSITORYOWNER" != "WildKernels" ]; then
            TARGET="@${REPOSITORYOWNER}"
          else
            TARGET="@${REPOSITORYOWNER}/oneplus-kernel-devs"
          fi

          LOGCONTENTS="$(
            cat main/notification.md 2>/dev/null ||
            true
          )"

          if [ -z "$LOGCONTENTS" ]; then
            LOGCONTENTS="Changes were detected, but no notification details were generated."
          fi

          ISSUENUMBER="$(
            gh issue list \
              --repo "${{ github.repository }}" \
              --label "notification" \
              --state open \
              --search "$DATETITLE" \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [ -z "$ISSUENUMBER" ]; then

            BODY="$(
              printf '%s\n\n%s\n\n---\n🔗 [View Action Summary](%s)' \
                "Hi $TARGET," \
                "$LOGCONTENTS" \
                "$RUNURL"
            )"

            gh issue create \
              --repo "${{ github.repository }}" \
              --title "$DATETITLE" \
              --body "$BODY" \
              --label "notification"

          else

            BODY="$(
              printf '%s\n\n%s\n\n---\n🔗 [View Action Summary](%s)' \
                "### 🔄 New Activity Detected ($(date -u +'%H:%M') UTC)" \
                "$LOGCONTENTS" \
                "$RUNURL"
            )"

            gh issue comment \
              "$ISSUENUMBER" \
              --repo "${{ github.repository }}" \
              --body "$BODY"

          fi

      - name: 📄 Update Status Branch
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          rm -rf repostatus-final

          mkdir -p repostatus-final
          cd repostatus-final

          git init -q

          STATUSURL="https://github.com/${{ github.repository }}.git"
          STATUSAPI="repos/${{ github.repository }}/branches/status-page"

          git remote add origin "$STATUSURL"

          echo "🔎 Checking status-page branch..."

          # Use gh api instead of git ls-remote.
          if gh api \
            "$STATUSAPI" \
            --silent \
            >/dev/null 2>&1
          then

            echo "✅ status-page branch exists."

            # Configure Git authentication through GitHub CLI.
            gh auth setup-git

            git fetch \
              --quiet \
              origin \
              refs/heads/status-page

            git checkout \
              --quiet \
              -B status-page \
              FETCH_HEAD

          else

            APIERROR="$(
              gh api \
                "$STATUSAPI" \
                --silent \
                2>&1 ||
                true
            )"

            if printf '%s\n' "$APIERROR" |
              grep -qiE \
                'Bad credentials|401|403|forbidden|Resource not accessible'
            then

              echo "❌ Unable to access status-page."
              printf '%s\n' "$APIERROR"
              exit 1

            fi

            echo "ℹ️ status-page does not exist."
            echo "ℹ️ Creating status-page branch."

            git checkout \
              --quiet \
              --orphan \
              status-page

            git rm -rf . \
              >/dev/null 2>&1 ||
              true

          fi

          {
            echo "# 📱 OnePlusOSS Kernel Tracker"
            echo
            echo "> **Last Update:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo "Automated monitoring report for OnePlusOSS Android kernel repositories."
            echo
            echo "---"
            echo
            cat ../manifest_summary.md
            echo
            echo "---"
            echo
            cat ../local-summary.md

          } > README.md

          cp \
            "../main/${STATEFILE}" \
            "$STATEFILE"

          git add README.md "$STATEFILE"

          if git diff --cached --quiet; then

            echo "ℹ️ No status-page changes detected."

            exit 0

          fi

          git commit \
            --quiet \
            -m "docs: sync OnePlusOSS kernel status [skip ci]"

          # Configure Git authentication through GitHub CLI.
          # GH_TOKEN is already provided by the workflow environment.
          gh auth setup-git

          echo "🚀 Pushing status-page..."

          if git push \
            --quiet \
            origin \
            HEAD:status-page
          then
            echo "✅ status-page updated successfully."
          else
            echo "❌ Failed to push status-page."
            echo "ℹ️ Verify that workflow permissions include: contents: write."
            exit 1
          fi
